[project]
name = "logablation"
version = "0.1.0"
description = "Which log line would have told me? A logging ablation on a three-agent LLM pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "langgraph>=1.2.15",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "pyarrow>=26.0.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logablation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
