[project]
name = "logablation"
version = "0.1.0"
description = "Which log line would have told me? A logging ablation on a three-agent LLM pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.15",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logablation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
